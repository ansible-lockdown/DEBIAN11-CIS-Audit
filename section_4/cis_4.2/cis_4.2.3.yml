---

{{ if .Vars.deb11cis_level_1 }}
  {{ if .Vars.deb11cis_rule_4_2_3 }}
command:
  iptables_flushed:
    title: 4.2.3 | Ensure iptables are flushed with nftables | iptable IPv4 flushed
    exec: iptables -S 2>/dev/null | grep -v '^-P '
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.2.3
      NIST800-53R5:
      - CA-9
      - SC-7
  ip6tables_flushed:
    title: 4.2.3 | Ensure iptables are flushed with nftables | iptable IPv4 flushed
    exec: ip6tables -S 2>/dev/null | grep -v '^-P '
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.2.3
      NIST800-53R5:
      - SC-7
      - CA-9
  {{ end }}
{{ end }}
