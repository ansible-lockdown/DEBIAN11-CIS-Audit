---

{{ if .Vars.deb11cis_level_1 }}
  {{ if .Vars.deb11cis_rule_6_1_2 }}
    {{ if eq .Vars.deb11cis_aide_scan "cron" }}
command:
  aide_cron:
    title: 6.1.2 | Ensure filesystem integrity is regularly checked | cron
    exec: |
      grep -Prs '^([^#\n\r]+\h+)?(\/usr\/s?bin\/|^\h*)aide(\.wrapper)?\h+(--(check|update)|([^#\n\r]+\h+)?\$AIDEARGS)\b' /etc/cron.* /etc/crontab /var/spool/cron/
    exit-status: 0
    stdout:
    - '/aide/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.2
      NIST800-53R5:
      - AU-2
    {{ end }}
    {{ if eq .Vars.deb11cis_aide_scan "timer" }}
service:
  dailyaidecheck.service:
    title: 6.1.2 | Ensure filesystem integrity is regularly checked | service
    enabled: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.2
      NIST800-53R5:
      - AU-2
  dailyaidecheck.timer:
    title: 6.1.2 | Ensure filesystem integrity is regularly checked | timer
    enabled: true
    running: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.2
      NIST800-53R5:
      - AU-2
    {{ end }}
  {{ end }}
{{ end }}
