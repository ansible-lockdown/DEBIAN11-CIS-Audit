---

{{ if .Vars.deb11cis_level_1 }}
  {{ if .Vars.deb11cis_rule_6_2_1_2_2 }}
    {{ if not .Vars.deb11cis_system_is_log_server }}
file:
  journal_remote_configured:
    title: 6.2.1.2.2 | Ensure systemd-journal-remote authentication is configured
    path: /etc/systemd/journal-upload.conf
    exists: true
    contents:
    - '/^URL={{ .Vars.deb11cis_journal_upload_url }}/'
    - '/ServerKeyFile={{ .Vars.deb11cis_journal_upload_serverkeyfile }}/'
    - '/ServerCertificateFile={{ .Vars.deb11cis_journal_servercertificatefile }}/'
    - '/TrustedCertificateFile={{ .Vars.deb11cis_journal_trustedcertificatefile }}/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.1.2.2
      NIST800-53R5:
      - AU-2
      - AU-12
    {{ end }}
  {{ end }}
{{ end }}
