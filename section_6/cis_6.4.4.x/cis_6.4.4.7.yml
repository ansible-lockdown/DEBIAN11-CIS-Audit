---

{{ if .Vars.deb11cis_level_2 }}
  {{ if .Vars.deb11cis_rule_6_4_4_7 }}
command:
  audit_conf_group:
    title: 6.4.4.7 | Ensure audit configuration files group owner is configured
    exec: find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \) ! -group root
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.4.4.7
      NIST800-53R5:
      - NA
  {{ end }}
{{ end }}
