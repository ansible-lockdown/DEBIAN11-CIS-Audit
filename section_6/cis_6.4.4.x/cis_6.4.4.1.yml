---

{{ if .Vars.deb11cis_level_2 }}
  {{ if .Vars.deb11cis_rule_6_4_4_1 }}
command:
  audit_logfile_perms:
    title: 6.4.4.1 | Ensure audit log files mode is configured
    exec: d=$(dirname $(grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }')); find $d -maxdepth 1 -type f -perm /0137
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.4.4.1
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
