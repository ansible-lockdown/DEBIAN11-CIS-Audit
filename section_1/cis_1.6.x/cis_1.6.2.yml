---

{{ if .Vars.deb11cis_level_1 }}
  {{ if .Vars.deb11cis_rule_1_6_2 }}
file:
  etc_issue_config:
    title: 1.6.2 | Ensure local login warning banner is configured properly
    path: /etc/issue
    exists: true
    contents:
    - '!/[Cc]ent[Oo][Ss].*/'
    - '!/[Rr]hel.*/'
    - '!/[Rr]ed[Hh]at.*/'
    - '!/[Rr]ocky.*/'
    - '!/[Aa]lma.*/'
    - '!/x86_64/'
    - '!/[Ll]inux'
    - '{{ .Vars.deb11cis_warning_banner }}'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.6.2
      NIST800-53R5:
      - CM-1
      - CM-3
      - CM-6
  {{ end }}
{{ end }}
